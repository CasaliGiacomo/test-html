<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Stimulus</title>
<script>
(function(){
  var w = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
  var meta = document.querySelector('meta[name="viewport"]');
  if(meta) meta.setAttribute('content', 'width=' + w + ', initial-scale=1.0');
})();
</script>
<style>
/* ── BASE (always applied, never touch) ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; }
body { overflow-x: hidden; }
#page-content { width: 100%; }

#scroll-hint {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.72); color: #fff; padding: 8px 18px;
  border-radius: 20px; font-size: 13px; z-index: 200;
  transition: opacity 0.4s; white-space: nowrap; pointer-events: none;
}
#scroll-hint.hidden { opacity: 0; pointer-events: none; }
</style>
<!-- Per-condition CSS injected here by JavaScript -->
<style id="condition-css"></style>
</head>
<body>

<div id="scroll-hint">&#8595; Scroll to explore</div>
<div id="page-content"></div>
<div id="consent-container"></div>

<script>
(function(){

  /* ════════════════════════════════════════════════
     URL PARAMETERS
     condition : A1 | A2 | M1 | M2 | L1 | L2
     delay     : seconds after first scroll before banner appears (default 7)
  ════════════════════════════════════════════════ */
  var params    = new URLSearchParams(window.location.search);
  var condition = (params.get('condition') || 'M2').toUpperCase();
  var delay     = parseInt(params.get('delay') || '7', 10) * 1000;
  var isInIframe = (window !== window.parent);

  /* ════════════════════════════════════════════════
     GLOBAL RESULT SENDER
     Every condition calls window.sendCookieResult()
     when the respondent makes their choice.
     DO NOT MODIFY — this is the IdSurvey integration.
  ════════════════════════════════════════════════ */
  window.sendCookieResult = function(choice, details) {
    if (isInIframe) {
      window.parent.postMessage({
        type:             'cookieStudyResult',
        cookie_choice:    choice,
        cookie_details:   details,
        cookie_timestamp: new Date().toISOString()
      }, '*');
    }
  };

  /* ════════════════════════════════════════════════
     CONDITIONS OBJECT
     Each condition has:
       css         — CSS string for fake website + consent overlay
       pageHtml    — HTML string for fake website content
       consentHtml — HTML string for consent overlay (starts with hidden attr)
       overlayId   — id of the overlay element shown by scroll trigger
       initConsent — function called after HTML injection; wires up buttons
                     and calls window.sendCookieResult() on choice
  ════════════════════════════════════════════════ */
  var C = {};

  /* ────────────────────────────────────────────────
     M2 — SocialSphere / Neutral
     (based on Christina's socialsphere-mobile-en-neutral.html)
  ──────────────────────────────────────────────── */
  C.M2 = {
    overlayId: 'ssOverlay',

    css: `
      :root{
        --accent:#2f7df6; --accent-dark:#1f63d6; --teal:#19c2c2;
        --like:#ed4956; --ink:#0f1419; --muted:#6b7280; --line:#efeff0; --soft:#f4f6f8;
      }
      button{font-family:inherit;cursor:pointer;}
      a{color:var(--accent-dark);text-decoration:none;}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:#fff;color:var(--ink);
        font-size:14px;line-height:1.4;padding-bottom:58px;}
      /* Top bar */
      .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
        display:flex;align-items:center;padding:10px 14px;}
      .ss-logo{display:flex;align-items:center;gap:8px;margin-right:auto;}
      .ss-mark{width:28px;height:28px;}
      .ss-word{font-size:20px;font-weight:800;letter-spacing:-.5px;}
      .ss-word b{background:linear-gradient(45deg,var(--accent),var(--teal));
        -webkit-background-clip:text;background-clip:text;color:transparent;}
      .top-icons{display:flex;gap:18px;}
      .top-icons button{background:none;border:0;font-size:23px;color:var(--ink);line-height:1;}
      /* Stories */
      .stories{display:flex;gap:14px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line);}
      .stories::-webkit-scrollbar{height:0;}
      .story{flex:0 0 auto;width:64px;text-align:center;}
      .ring{width:62px;height:62px;border-radius:50%;padding:2.5px;
        background:linear-gradient(45deg,var(--accent),var(--teal));}
      .ring.me{background:#dadde1;}
      .ring .pic{width:100%;height:100%;border-radius:50%;border:2px solid #fff;display:flex;
        align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px;position:relative;}
      .ring.me .pic{color:#65676b;background:#eef0f2;}
      .ring.me .pic .add{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;
        border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff;font-size:13px;
        display:flex;align-items:center;justify-content:center;}
      .story span{display:block;font-size:11px;margin-top:5px;color:var(--ink);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      /* Posts */
      .post{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px;}
      .post-head{display:flex;align-items:center;gap:10px;padding:10px 14px;}
      .post-head .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
        justify-content:center;color:#fff;font-weight:800;font-size:15px;}
      .post-head .name{font-weight:700;font-size:13.5px;}
      .post-head .loc{font-size:11.5px;color:var(--muted);}
      .post-head .more{margin-left:auto;font-size:20px;background:none;border:0;color:var(--ink);}
      .post-img{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
      .post-img svg{width:24%;height:24%;opacity:.7;}
      .p1{background:linear-gradient(135deg,#bcd4f7,#5b8fe6);} .p1 svg{color:#2f5fa8;}
      .p2{background:linear-gradient(135deg,#bdeee9,#39b8ad);} .p2 svg{color:#127c73;}
      .actions{display:flex;align-items:center;gap:16px;padding:10px 14px 6px;font-size:25px;}
      .actions button{background:none;border:0;color:var(--ink);line-height:1;padding:0;}
      .actions .like.on{color:var(--like);}
      .actions .save{margin-left:auto;}
      .likes{padding:0 14px;font-weight:700;font-size:13.5px;}
      .cap{padding:4px 14px 0;font-size:13.5px;}
      .cap b{font-weight:700;}
      .cmts{padding:4px 14px 0;font-size:13px;color:var(--muted);}
      .time{padding:4px 14px 0;font-size:10.5px;color:var(--muted);
        text-transform:uppercase;letter-spacing:.3px;}
      /* Bottom nav */
      .nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;
        border-top:1px solid var(--line);display:flex;justify-content:space-around;
        align-items:center;padding:9px 0 11px;}
      .nav button{background:none;border:0;color:var(--ink);}
      .nav svg{width:26px;height:26px;}
      .nav .me{width:26px;height:26px;border-radius:50%;
        background:linear-gradient(45deg,var(--accent),var(--teal));
        display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}
      /* Consent overlay */
      .consent-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
        display:flex;align-items:flex-end;}
      .consent-overlay[hidden]{display:none;}
      .consent{background:#fff;color:var(--ink);width:100%;border-radius:16px 16px 0 0;
        box-shadow:0 -10px 36px rgba(0,0,0,.3);max-height:92vh;display:flex;flex-direction:column;}
      .c-body{padding:18px 18px 0;overflow-y:auto;}
      .consent h2{font-size:18px;margin:0 0 10px;font-weight:800;line-height:1.3;}
      .consent p{font-size:13px;color:#3a3f45;margin:0 0 12px;line-height:1.5;}
      .consent h3{font-size:14.5px;margin:16px 0 8px;font-weight:800;}
      .consent a{text-decoration:underline;color:var(--accent-dark);}
      .consent ul{margin:0 0 12px;padding-left:20px;}
      .consent ul li{font-size:12.5px;color:#55585e;line-height:1.5;margin-bottom:8px;}
      .optrow{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);
        align-items:flex-start;cursor:pointer;}
      .optrow input{appearance:none;-webkit-appearance:none;width:22px;height:22px;
        border:2px solid #b6bcc4;border-radius:50%;margin:2px 0 0;flex:0 0 auto;position:relative;}
      .optrow input:checked{border-color:var(--accent);}
      .optrow input:checked:after{content:"";position:absolute;inset:3px;
        border-radius:50%;background:var(--accent);}
      .optrow .t strong{display:block;font-size:14.5px;margin-bottom:3px;}
      .optrow .t span{font-size:12.5px;color:#55585e;line-height:1.5;}
      .c-foot{padding:14px 18px;border-top:1px solid var(--line);background:#fff;}
      .ss-btn{width:100%;border-radius:24px;padding:13px;font-size:15px;font-weight:700;
        background:var(--accent);color:#fff;border:none;cursor:pointer;}
      .ss-btn:hover{background:var(--accent-dark);}
      .ss-warn{display:none;color:#cc0000;font-size:12px;text-align:center;padding:6px 0 0;}
      .ss-warn.show{display:block;}
    `,

  /* ────────────────────────────────────────────────

  C.L1 = {

    css: `
      body { background: #f3f2ef; font-family: Arial, sans-serif; }
      /* PLACEHOLDER: insert Contact website CSS here */
    `,
    pageHtml: `
      <!-- PLACEHOLDER: insert Contact website HTML here -->
      <div style="padding:40px;text-align:center;color:#999">
        <h2>Contact &ndash; Status Quo</h2>
        <p>PLACEHOLDER &mdash; website HTML to be inserted here</p>

    `,
    consentHtml: `
      <!-- PLACEHOLDER: Contact Status Quo consent notice (2 screens) -->
      <div id="l1Overlay" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.5);
           z-index:60;display:flex;align-items:flex-end;">

            border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px">Yes, keep all connected</button>
          <button id="l1Separate" style="background:#fff;border:1px solid #999;padding:10px 24px;
            border-radius:24px;font-size:14px;cursor:pointer;margin-top:12px;margin-left:8px">Connect none</button>
          <button id="l1More" style="background:#fff;border:1px solid #0A66C2;padding:10px 24px;
            border-radius:24px;font-size:14px;cursor:pointer;margin-top:12px;margin-left:8px;color:#0A66C2">More options</button>
        </div>

    `,
    initConsent: function() {
      document.getElementById('l1Connect').addEventListener('click', function() {

  /* ────────────────────────────────────────────────

  C.L2 = {
    overlayId: 'l2Overlay',
    css: C.L1.css,
    pageHtml: C.L1.pageHtml,
    consentHtml: `
      <!-- PLACEHOLDER: Contact Neutral consent notice (2 screens) -->
      <div id="l2Overlay" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.5);

  /* ════════════════════════════════════════════════
     LOAD CONDITION
  ════════════════════════════════════════════════ */
  var cond = C[condition];
  if (!cond) {
    document.body.innerHTML = '<p style="padding:40px;font-family:Arial;color:#666">Unknown condition: ' + condition + '</p>';
    return;
  }

  // Inject condition CSS
  document.getElementById('condition-css').textContent = cond.css;

  // Inject page content
  document.getElementById('page-content').innerHTML = cond.pageHtml;

  // Inject consent overlay
  document.getElementById('consent-container').innerHTML = cond.consentHtml;

  // Wire up consent buttons and interactions
  cond.initConsent();

  /* ════════════════════════════════════════════════
     SCROLL TRIGGER
     Shows consent overlay N seconds after first scroll
  ════════════════════════════════════════════════ */
  var scrollFired = false;
  var hintEl = document.getElementById('scroll-hint');

  function showBanner() {
    hintEl.classList.add('hidden');
    var overlay = document.getElementById(cond.overlayId);
    if (overlay) overlay.removeAttribute('hidden');
  }

  if (delay === 0) {
    hintEl.classList.add('hidden');
    showBanner();
  } else {
    window.addEventListener('scroll', function onS() {
      if (scrollFired) return;
      scrollFired = true;
      window.removeEventListener('scroll', onS);
      hintEl.classList.add('hidden');
      setTimeout(showBanner, delay);
    });
  }

})();
