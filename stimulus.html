<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Stimulus</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; }
body { font-family: Arial, sans-serif; overflow-x: hidden; }
#page-content { width: 100%; }
.amz-nav, .amz-sub, .amz-hero, .amz-section, .amz-footer, .amz-footer-bot,
.li-nav, .li-main,
.fb-nav, .fb-main { width: 100%; }

#scroll-hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.72); color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; z-index:200; transition:opacity 0.4s; white-space:nowrap; }
#scroll-hint.hidden { opacity:0; pointer-events:none; }

#cookie-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; display:none; align-items:flex-end; justify-content:center; }
#cookie-overlay.visible { display:flex; }
#cookie-banner { background:#fff; width:100%; padding:18px 16px; box-shadow:0 -3px 16px rgba(0,0,0,0.18); }
#cookie-banner h2 { font-size:15px; font-weight:700; margin-bottom:6px; }
#cookie-banner p  { font-size:12px; color:#444; line-height:1.5; margin-bottom:12px; }
#cookie-banner p a { text-decoration:underline; cursor:pointer; }
.cookie-btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.btn-accept  { padding:9px 16px; border-radius:4px; font-size:13px; font-weight:700; cursor:pointer; border:none; flex:1; }
.btn-decline { padding:9px 16px; border-radius:4px; font-size:13px; cursor:pointer; background:#fff; flex:1; }
.btn-personal{ padding:9px 16px; border-radius:4px; font-size:13px; cursor:pointer; background:#fff; flex:1; }
.cookie-msg { margin-top:6px; font-size:12px; padding:8px 12px; border-radius:4px; display:none; }
.cookie-msg.accepted     { background:#EAF3DE; color:#3B6D11; border:1px solid #C0DD97; }
.cookie-msg.declined     { background:#FCEBEB; color:#A32D2D; border:1px solid #F7C1C1; }
.cookie-msg.personalized { background:#E6F1FB; color:#185FA5; border:1px solid #B5D4F4; }

#personal-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10000; align-items:center; justify-content:center; padding:16px; }
#personal-modal.open { display:flex; }
.pm-box { background:#fff; border-radius:8px; padding:20px; width:100%; max-width:400px; }
.pm-box h3 { font-size:15px; font-weight:700; margin-bottom:4px; }
.pm-box > p { font-size:12px; color:#555; margin-bottom:14px; line-height:1.4; }
.pm-toggle { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #eee; }
.pm-toggle:last-of-type { border-bottom:none; }
.pm-toggle-label { font-size:13px; font-weight:600; }
.pm-toggle-sub { font-size:11px; color:#888; margin-top:2px; }
.toggle-switch { position:relative; width:40px; height:22px; flex-shrink:0; }
.toggle-switch input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:#ccc; border-radius:22px; cursor:pointer; transition:.2s; }
.toggle-slider::before { content:''; position:absolute; width:16px; height:16px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
.toggle-switch input:checked + .toggle-slider { background:var(--accent); }
.toggle-switch input:checked + .toggle-slider::before { transform:translateX(18px); }
.toggle-switch input:disabled + .toggle-slider { opacity:.7; cursor:not-allowed; }
.pm-actions { display:flex; gap:8px; margin-top:16px; }
.pm-save { flex:1; padding:9px; border-radius:4px; font-size:13px; font-weight:700; cursor:pointer; border:none; background:var(--accent); color:var(--accent-text); }
.pm-cancel { flex:1; padding:9px; border-radius:4px; font-size:13px; cursor:pointer; background:#fff; border:1px solid #999; }

/* AMAZON */
body.amazon { --accent:#FF9900; --accent-text:#111; background:#EAEDED; }
body.amazon .btn-accept  { background:#FF9900; color:#111; border:1px solid #a88734; }
body.amazon .btn-decline { border:1px solid #888; color:#111; }
body.amazon .btn-personal{ border:1px solid #007185; color:#007185; }
body.amazon #cookie-banner { border-top:4px solid #FF9900; }
body.amazon #cookie-banner a { color:#007185; }
.amz-nav { background:#131921; color:#fff; padding:8px 12px; display:flex; align-items:center; gap:8px; }
.amz-logo { color:#FF9900; font-size:20px; font-weight:700; white-space:nowrap; }
.amz-logo span { color:#fff; font-size:10px; }
.amz-search { flex:1; display:flex; height:36px; }
.amz-search input { flex:1; border:none; padding:0 8px; font-size:13px; outline:none; border-radius:4px 0 0 4px; }
.amz-search button { background:#FF9900; border:none; padding:0 10px; cursor:pointer; border-radius:0 4px 4px 0; }
.amz-sub { background:#232F3E; display:flex; overflow-x:auto; padding:0 8px; }
.amz-sub a { color:#fff; font-size:12px; padding:8px 10px; white-space:nowrap; text-decoration:none; }
.amz-hero { background:linear-gradient(135deg,#c8d7e8,#a8c4de); padding:16px; }
.amz-hero-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.6); border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700; margin-bottom:12px; }
.amz-hero-badge i { color:#FF9900; }
.amz-hero-inner { background:#fff; border-radius:4px; padding:16px; max-width:220px; box-shadow:0 2px 5px rgba(0,0,0,.15); }
.amz-hero-inner h2 { font-size:16px; font-weight:700; margin-bottom:6px; }
.amz-hero-inner p  { font-size:12px; color:#333; margin-bottom:10px; }
.amz-btn { background:#FF9900; border:1px solid #a88734; padding:7px 14px; border-radius:4px; font-size:13px; font-weight:700; cursor:pointer; }
.amz-section { padding:12px; }
.amz-section h3 { font-size:16px; font-weight:700; color:#111; margin-bottom:12px; }
.amz-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.amz-card { background:#fff; border-radius:4px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,.1); }
.amz-card h4 { font-size:13px; font-weight:700; margin-bottom:8px; color:#111; }
.amz-card-imgs { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:6px; }
.amz-card-imgs div { background:#EAEDED; aspect-ratio:1; border-radius:3px; display:flex; align-items:center; justify-content:center; }
.amz-prods { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.amz-prod .img-box { background:#f7f7f7; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:4px; margin-bottom:6px; border:1px solid #eee; }
.amz-prod .name  { font-size:11px; color:#111; margin-bottom:3px; line-height:1.3; }
.amz-prod .price { color:#B12704; font-weight:700; font-size:13px; }
.amz-prod .old   { color:#888; font-size:11px; text-decoration:line-through; }
.amz-prod .prime { color:#00A8E0; font-size:10px; font-weight:700; }
.amz-footer { background:#232F3E; color:#fff; padding:16px 12px; }
.amz-footer h4 { font-size:13px; font-weight:700; margin-bottom:8px; }
.amz-footer a  { display:block; font-size:12px; color:#DDD; margin-bottom:4px; cursor:pointer; }
.amz-footer-bot { background:#131921; color:#666; padding:12px; text-align:center; font-size:11px; }

/* LINKEDIN */
body.linkedin { --accent:#0A66C2; --accent-text:#fff; background:#f3f2ef; }
body.linkedin .btn-accept  { background:#0A66C2; color:#fff; border:1px solid #004182; }
body.linkedin .btn-decline { border:1px solid #888; color:#333; }
body.linkedin .btn-personal{ border:1px solid #0A66C2; color:#0A66C2; }
body.linkedin #cookie-banner { border-top:4px solid #0A66C2; }
body.linkedin #cookie-banner a { color:#0A66C2; }
.li-nav { background:#fff; border-bottom:1px solid #e0dfdf; padding:0 12px; display:flex; align-items:center; gap:8px; height:52px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.li-logo { color:#0A66C2; font-size:26px; font-weight:900; }
.li-search { display:flex; align-items:center; background:#EEF3F8; border-radius:4px; padding:5px 10px; gap:6px; flex:1; }
.li-search input { border:none; background:transparent; outline:none; font-size:13px; width:100%; }
.li-nav-icons { display:flex; }
.li-nav-icon { display:flex; flex-direction:column; align-items:center; padding:4px 8px; font-size:10px; color:#666; cursor:pointer; }
.li-nav-icon i { font-size:20px; }
.li-nav-icon.active { color:#0A66C2; border-bottom:2px solid #0A66C2; }
.li-main { padding:12px; }
.li-profile-card { background:#fff; border:1px solid #e0dfdf; border-radius:8px; overflow:hidden; margin-bottom:8px; }
.li-profile-bg { height:60px; background:linear-gradient(135deg,#0A66C2,#004182); }
.li-profile-info { padding:0 16px 14px; text-align:center; margin-top:-24px; }
.li-avatar { width:48px; height:48px; background:#e0dfdf; border-radius:50%; border:2px solid #fff; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; }
.li-post { background:#fff; border:1px solid #e0dfdf; border-radius:8px; padding:12px; margin-bottom:8px; }
.li-post-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.li-post-avatar { width:36px; height:36px; background:#e0dfdf; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.li-post-name { font-size:13px; font-weight:700; color:#000; }
.li-post-sub  { font-size:11px; color:#666; }
.li-post-text { font-size:13px; color:#333; line-height:1.4; margin-bottom:8px; }
.li-post-actions { display:flex; border-top:1px solid #e0dfdf; padding-top:6px; }
.li-post-action { flex:1; display:flex; align-items:center; justify-content:center; gap:4px; padding:6px 4px; font-size:12px; color:#666; cursor:pointer; border-radius:4px; }
.li-jobs { background:#fff; border:1px solid #e0dfdf; border-radius:8px; padding:12px; margin-bottom:8px; }
.li-job-item { padding:8px 0; border-bottom:1px solid #e0dfdf; }
.li-job-item:last-child { border-bottom:none; }

/* FACEBOOK */
body.facebook { --accent:#1877F2; --accent-text:#fff; background:#f0f2f5; }
body.facebook .btn-accept  { background:#1877F2; color:#fff; border:1px solid #1461c0; }
body.facebook .btn-decline { border:1px solid #888; color:#333; }
body.facebook .btn-personal{ border:1px solid #1877F2; color:#1877F2; }
body.facebook #cookie-banner { border-top:4px solid #1877F2; }
body.facebook #cookie-banner a { color:#1877F2; }
.fb-nav { background:#fff; padding:0 12px; display:flex; align-items:center; gap:8px; height:56px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
.fb-logo { color:#1877F2; font-size:28px; font-weight:900; font-style:italic; }
.fb-search { display:flex; align-items:center; background:#f0f2f5; border-radius:20px; padding:7px 12px; gap:6px; flex:1; }

.fb-nav-icons { display:flex; }
.fb-nav-icon { padding:6px 8px; cursor:pointer; border-radius:8px; color:#65676B; border-bottom:3px solid transparent; }

.fb-story span { font-size:11px; font-weight:700; color:#fff; }
.fb-compose { background:#fff; border-radius:10px; box-shadow:0 1px 2px rgba(0,0,0,.1); padding:10px 12px; margin-bottom:10px; }
.fb-compose-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }

.fb-compose-action { flex:1; display:flex; align-items:center; justify-content:center; gap:4px; padding:5px; cursor:pointer; font-size:12px; font-weight:600; color:#65676B; border-radius:6px; }

.fb-post-header { display:flex; align-items:center; gap:8px; padding:10px 12px; }
.fb-post-avatar { width:36px; height:36px; background:#e7f3ff; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.fb-post-name { font-size:14px; font-weight:700; color:#050505; }
.fb-post-time { font-size:12px; color:#65676B; }
.fb-post-text { padding:0 12px 10px; font-size:14px; color:#050505; line-height:1.4; }
.fb-post-img  { background:#e4e6eb; height:200px; display:flex; align-items:center; justify-content:center; }
.fb-post-img i { font-size:48px; color:#bcc0c4; }
.fb-post-meta { padding:5px 12px; font-size:12px; color:#65676B; border-bottom:1px solid #e4e6eb; }
.fb-post-actions { display:flex; padding:2px 4px; }
.fb-post-action { flex:1; display:flex; align-items:center; justify-content:center; gap:4px; padding:7px 4px; cursor:pointer; font-size:13px; font-weight:600; color:#65676B; border-radius:4px; }
</style>

<body>

<div id="scroll-hint">&#8595; Scroll to explore</div>

<div id="cookie-overlay">
  <div id="cookie-banner">
    <h2 id="banner-title"></h2>
    <p id="banner-body"></p>
    <div class="cookie-btns">
      <button class="btn-accept"   onclick="handleCookie('accepted')"><span id="btn-accept-label"></span></button>
      <button class="btn-decline"  onclick="handleCookie('declined')"><span id="btn-decline-label"></span></button>
      <button class="btn-personal" onclick="openPersonalize()"><span id="btn-personal-label"></span></button>
    </div>
    <div class="cookie-msg accepted"     id="msg-accepted"></div>
    <div class="cookie-msg declined"     id="msg-declined"></div>

  </div>
</div>

<div id="personal-modal">
  <div class="pm-box">
    <h3>&#9881; Cookie Settings</h3>
    <p>Choose which cookies you want to allow. Necessary cookies cannot be disabled.</p>
    <div class="pm-toggle">
      <div><div class="pm-toggle-label">Necessary</div><div class="pm-toggle-sub">Required for the site to work</div></div>
      <label class="toggle-switch"><input type="checkbox" checked disabled><span class="toggle-slider"></span></label>

    <div class="pm-toggle">
      <div><div class="pm-toggle-label">Analytics</div><div class="pm-toggle-sub">Help us understand usage</div></div>
      <label class="toggle-switch"><input type="checkbox" id="t-analytics"><span class="toggle-slider"></span></label>

    <div class="pm-toggle">
      <div><div class="pm-toggle-label">Marketing</div><div class="pm-toggle-sub">Personalised ads</div></div>
      <label class="toggle-switch"><input type="checkbox" id="t-marketing"><span class="toggle-slider"></span></label>

      <button class="pm-save" onclick="savePersonal()">Save Settings</button>
      <button class="pm-cancel" onclick="closePersonalize()">Cancel</button>
    </div>
  </div>
</div>

<div id="page-content"></div>

<script>

  var delay   = parseInt(params.get('delay') || '3', 10) * 1000;
  var isInIframe = (window !== window.parent);

  document.body.classList.add(company);

  var content = {
    amazon: {
      A: { title:'🍪 Your Privacy Settings', body:'We use cookies to enhance your shopping experience and deliver our services. Choose which cookies to allow. <a href="#">Privacy Policy</a> | <a href="#">Cookie Policy</a>', accept:'✓ Accept All', decline:'✗ Decline All', personal:'⚙ Customise', ok_a:'✓ All cookies accepted.', ok_d:'✗ Only necessary cookies active.', ok_p:'✓ Settings saved.' },

      B: { title:'🍪 Stay Connected & Relevant', body:"Cookies help LinkedIn show you jobs and content that matter to you. <a href='#'>Learn more</a>", accept:'Accept & Continue', decline:'Decline', personal:'Manage', ok_a:'✓ Your personalised LinkedIn experience is ready.', ok_d:'✗ Only essential cookies active.', ok_p:'✓ Preferences saved.' }

  var html = '';

  if (company === 'amazon') {
    html = '<nav class="amz-nav"><div class="amz-logo">amazon<span>.de</span></div><div class="amz-search"><input type="text" placeholder="Search Amazon.de"><button><i class="ti ti-search" style="color:#333;font-size:18px"></i></button></div><div style="display:flex;align-items:center;gap:4px;color:#fff;padding:0 4px"><i class="ti ti-shopping-cart" style="font-size:24px"></i><span style="color:#FF9900;font-weight:700">0</span></div></nav><nav class="amz-sub"><a style="font-weight:700">☰ All</a><a>Best Sellers</a><a>Prime</a><a>Deals</a><a>New Arrivals</a></nav><div class="amz-hero"><div class="amz-hero-badge"><i class="ti ti-bolt"></i> Lightning Deals – up to 50% off</div><div class="amz-hero-inner"><h2>Exclusive Deals</h2><p>Today\'s top discounts on premium products.</p><button class="amz-btn">Shop Now</button></div></div><div class="amz-section"><h3>Browse categories</h3><div class="amz-grid2">' +
      [['Top Sellers','ti-device-laptop','ti-headphones'],['Fashion','ti-shirt','ti-shoe'],['Toys & Games','ti-device-gamepad','ti-puzzle'],['Home & Garden','ti-tool','ti-plant']].map(function(x){ return '<div class="amz-card"><h4>'+x[0]+'</h4><div class="amz-card-imgs"><div><i class="ti '+x[1]+'" style="font-size:28px;color:#999"></i></div><div><i class="ti '+x[2]+'" style="font-size:28px;color:#999"></i></div></div><span style="font-size:12px;color:#007185;cursor:pointer">Discover more</span></div>'; }).join('') +

      [['ti-device-airpods','Wireless Headphones','€24,99','€39,99',true],['ti-device-watch','Smartwatch','€49,99','',true],['ti-device-tablet','Fire HD 10','€149,99','',false],['ti-coffee','Coffee Machine','€89,95','',true],['ti-smart-home','Smart Plug','€12,99','',true],['ti-book','Cookbook','€19,99','',false]].map(function(x){ return '<div class="amz-prod"><div class="img-box"><i class="ti '+x[0]+'" style="font-size:32px;color:#bbb"></i></div><div class="name">'+x[1]+'</div><div class="price">'+x[2]+(x[3]?' <span class="old">'+x[3]+'</span>':'')+'</div>'+(x[4]?'<div class="prime">✓ Prime</div>':'')+'</div>'; }).join('') +
